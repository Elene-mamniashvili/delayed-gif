<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delayed GIF Example</title>
  <style>
    #myGif {
      display: none; /* hide initially */
      width: 300px;  /* adjust size if needed */
    }
  </style>
</head>
<body>

  
  <!-- GIF element -->
  <img id="myGif" src="https://res.cloudinary.com/dsn1wvo6p/image/upload/v1766514286/Giff2_FInal_bxwo12.gif" alt="Delayed GIF">

  <script>
    // Wait 15 seconds then show the GIF
    setTimeout(function() {
      document.getElementById('myGif').style.display = 'block';
    }, 15000); // 15000 ms = 15 seconds
  </script>
</body>
</html>
